[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "economic-graph-mvp"
version = "0.1.0"
description = "Base técnica de ConectaPyME para el reto de Economic Graph e incrementalidad."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.10,<5",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]
ui = [
    "streamlit==1.66.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/economic_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: prueba opcional contra MongoDB dedicado y explícitamente autorizado"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
